  <h2>数据保存在哪里？</h2>
  <p>人生看板 1.0 的数据仅保存在当前设备中，不需要注册账户，也不会上传到我们的服务器。卸载应用前请确认不再需要设备内的数据。</p>

  <h2>更换设备后会自动同步吗？</h2>
  <p>当前暂不支持跨设备自动同步。更换设备前，建议先在旧设备通过 App 内“关于”页面导出数据，再在新设备导入。云同步等更多功能正在规划中，敬请期待。</p>
